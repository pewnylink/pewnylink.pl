<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestracja - pewnylink.pl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-center items-center px-4 py-8">

    <div class="max-w-md w-full bg-slate-800/60 border border-slate-700/60 rounded-2xl p-8 shadow-2xl backdrop-blur">
        <div class="text-center mb-6">
            <a href="/" class="text-3xl font-black tracking-tight text-white inline-block mb-2">
                pewny<span class="text-indigo-500">link</span>.pl
            </a>
            <h1 class="text-xl font-bold text-white">Utwórz nowe konto</h1>
            <p class="text-xs text-slate-400 mt-1">Uzyskaj dostęp do pełnych raportów i analiz ogłoszeń</p>
        </div>

        <div id="error-alert" class="hidden mb-4 p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-400 text-xs text-center"></div>

        <form id="register-form" class="space-y-4">
            <div>
                <label for="email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Adres e-mail</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">
                        <i class="fa-regular fa-envelope text-sm"></i>
                    </span>
                    <input type="email" id="email" name="email" required placeholder="twoj@email.pl" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Hasło</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" id="password" name="password" minlength="8" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2.5 pl-10 pr-10 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                    <button type="button" onclick="togglePasswordVisibility('password', 'eyeIcon')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 transition focus:outline-none" tabindex="-1" title="Pokaż / ukryj hasło">
                        <i id="eyeIcon" class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
                <p class="text-[10px] text-slate-500 mt-1">Minimum 8 znaków</p>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/20 text-sm">
                Załóż konto
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400">
            Masz już konto? <a href="/login" class="text-indigo-400 hover:underline font-medium">Zaloguj się</a>
        </div>
    </div>

    <div class="mt-6 text-center">
        <a href="/" class="text-xs text-slate-500 hover:text-slate-300 transition">← Powrót do strony głównej</a>
    </div>

    <script>
        function togglePasswordVisibility(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const eyeIcon = document.getElementById(iconId);
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorAlert = document.getElementById('error-alert');
            errorAlert.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.access_token) {
                        document.cookie = `access_token=${data.access_token}; path=/; max-age=86400`;
                    }
                    window.location.href = '/my-reports';
                } else {
                    errorAlert.innerText = data.detail || 'Błąd rejestracji. Podany email może być zajęty.';
                    errorAlert.classList.remove('hidden');
                }
            } catch (err) {
                errorAlert.innerText = 'Wystąpił błąd połączenia z serwerem.';
                errorAlert.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
