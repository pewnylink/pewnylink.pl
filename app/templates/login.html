<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - pewnylink.pl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-center items-center px-4">

    <div class="max-w-md w-full bg-slate-800/60 border border-slate-700/60 rounded-2xl p-8 shadow-2xl backdrop-blur">
        <div class="text-center mb-6">
            <a href="/" class="text-3xl font-black tracking-tight text-white inline-block mb-2">
                pewny<span class="text-indigo-500">link</span>.pl
            </a>
            <h1 class="text-xl font-bold text-white">Zaloguj się do konta</h1>
            <p class="text-xs text-slate-400 mt-1">Dostęp do historii raportów i audytów bezpieczeństwa</p>
        </div>

        <form action="/auth/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Adres e-mail</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-regular fa-envelope text-sm"></i>
                    </span>
                    <input type="email" name="email" required placeholder="twoj@email.pl" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Hasło</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/20 text-sm">
                Zaloguj się
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400">
            Nie masz jeszcze konta? <a href="/register" class="text-indigo-400 hover:underline">Zarejestruj się</a>
        </div>
    </div>

    <div class="mt-6 text-center">
        <a href="/" class="text-xs text-slate-500 hover:text-slate-300 transition">← Powrót do strony głównej</a>
    </div>

</body>
</html>
